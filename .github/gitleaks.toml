# gitleaks configuration used by .github/workflows/ci.yml.
# Extends the default rule set and allow-lists only the committed, public,
# DEV-ONLY placeholders. Never add a real secret pattern here.
title = "CareNexus gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public local-development placeholders (rejected by the API outside local/docker profiles)"
regexes = [
  '''(docker|local)-dev-only-jwt-secret-NOT-FOR-PRODUCTION[0-9a-zA-Z]*''',
  '''local_dev_password''',
  # Published demo-account passwords of the dev seed (db/seed V2, V21), used by frontend/e2e.
  '''patient@thomas''',
  '''doctor@banda''',
  '''proxy@sarah''',
  # Dev-only TOTP-secret encryption key (base64 of "carenexus-dev-only-mfa-key-32byt"), committed for the
  # local, docker and test profiles. MfaStartupChecks refuses it in every other environment.
  '''Y2FyZW5leHVzLWRldi1vbmx5LW1mYS1rZXktMzJieXQ=''',
  # Notification dedupe-key constant (ReminderText.FIRST_REMINDER_KEY), not a credential.
  '''APPT_REMINDER_24H''',
]
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)package-lock\.json$''',
  # Backend test sources: fixture passwords, reset tokens and webhook secrets that exist only to exercise
  # validation and startup checks against a throwaway Testcontainers database.
  '''^backend/carenexus-api/src/test/''',
]
