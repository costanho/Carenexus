name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Manual runs can also run the browser end-to-end job (see the e2e job below).
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the browser end-to-end tests (docker compose stack + Playwright)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvnw verify, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/carenexus-api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/carenexus-api/pom.xml

      # Integration tests start PostgreSQL through Testcontainers, using the
      # Docker engine that ubuntu-latest runners provide.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/carenexus-api/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (npm ci, type check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Blocking: any critical advisory fails the build.
      - name: npm audit (critical, blocking)
        run: npm audit --audit-level=critical

      # Report only: high advisories are listed in the log but never fail the build.
      - name: npm audit (high, report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Scans the commits in the push / pull request. Committed dev-only placeholders
      # are allow-listed in .github/gitleaks.toml. Repositories owned by a GitHub
      # organization must add a GITLEAKS_LICENSE secret (free from gitleaks.io).
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # Optional: browser end-to-end tests against the real local stack (PostgreSQL, LiveKit in dev
  # mode, API) started with docker compose, and the exported web app. Runs only when started
  # manually (Actions > CI > Run workflow), because it builds the API image and takes ~15 min.
  e2e:
    name: Browser end-to-end (Playwright)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the stack (postgres, livekit dev, api)
        run: |
          JWT_SECRET="$(openssl rand -base64 64 | tr -d '\n')"
          echo "::add-mask::$JWT_SECRET"
          export JWT_SECRET
          docker compose up -d --build postgres-db livekit carenexus-api
          for i in $(seq 1 60); do
            curl -fsS http://localhost:9000/actuator/health >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://localhost:9000/actuator/health

      - name: Install dependencies and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the web app
        working-directory: frontend
        run: npm run e2e:build

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/e2e-report
            frontend/e2e-results
          retention-days: 7

      - name: API logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 carenexus-api livekit
