# Local development stack: Postgres + LiveKit (dev mode) + API (Spring profile 'docker', which also loads the demo
# seed data) + the web app (static export behind nginx).
# Not a production deployment: the 'docker' profile is a developer profile (demo accounts, development secrets,
# local providers) and the API refuses to start when it is combined with CARENEXUS_ENVIRONMENT=staging|production.
# Before the first `docker compose up`:
#   cp .env.example .env
# (.env is git-ignored). Real environments must generate their own secrets.
#
#   docker compose up -d --build                     # everything; web on http://localhost:8081
#   docker compose up -d --build postgres-db livekit carenexus-api   # backend only (CI, `npx expo start --web`)
services:
  postgres-db:
    image: postgres:16
    container_name: carenexus-postgres
    environment:
      POSTGRES_DB: carenexus_db
      POSTGRES_USER: carenexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "carenexus", "-d", "carenexus_db"]
      timeout: 5s
      retries: 10
      interval: 5s

  livekit:
    image: livekit/livekit-server:v1.13.9
    container_name: carenexus-livekit
    # DEV ONLY: --dev uses the public dev key pair devkey/secret.
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        room:
          auto_create: true
        webhook:
          api_key: devkey
          urls:
            - http://carenexus-api:9000/api/integrations/livekit/webhook
            - http://host.docker.internal:9000/api/integrations/livekit/webhook
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  carenexus-api:
    build:
      context: ./backend/carenexus-api
      dockerfile: Dockerfile
    container_name: carenexus-api
    # Every variable in .env reaches the API, so the optional settings documented in .env.example work in this
    # stack too. The `environment` entries below win over .env (the profile and the datasource stay fixed).
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/carenexus_db
      SPRING_DATASOURCE_USERNAME: carenexus
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      # No default on purpose: compose refuses to start without it. Copy .env.example to .env.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - copy .env.example to .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
      # Links in emails and notifications point at the web app (carenexus-web below, or `npx expo start --web`).
      CARENEXUS_WEB_BASE_URL: ${CARENEXUS_WEB_BASE_URL:-http://localhost:8081}
      # LiveKit dev defaults come from the 'docker' profile; override only when needed.
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_CLIENT_URL: ${LIVEKIT_CLIENT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      # Swagger UI and /v3/api-docs stay off unless explicitly enabled on a trusted machine.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # How often lapsed caregiver grants are swept (ends their conversation memberships).
      MESSAGING_ACCESS_EXPIRY_SWEEP_MS: ${MESSAGING_ACCESS_EXPIRY_SWEEP_MS:-60000}
      # Rate limits are on by default. The browser end-to-end suites sign in and open conversations far more often
      # than the per-IP and per-user buckets allow, so their runs set RATE_LIMIT_ENABLED=false in .env.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Help & Support contact and clinic name (fallbacks of the administrator's system settings; empty = not shown
      # / the code default "CareNexus").
      CLINIC_NAME: ${CLINIC_NAME:-}
      SUPPORT_CONTACT_EMAIL: ${SUPPORT_CONTACT_EMAIL:-}
      SUPPORT_CONTACT_PHONE: ${SUPPORT_CONTACT_PHONE:-}
    ports:
      - "9000:9000"
    depends_on:
      postgres-db:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      # The alpine runtime image has busybox wget, not curl
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 10s
      start_period: 40s

  carenexus-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the bundle at build time: rebuild (`--build`) after changing them.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:9000}
        EXPO_PUBLIC_SUPPORT_EMAIL: ${EXPO_PUBLIC_SUPPORT_EMAIL:-}
    container_name: carenexus-web
    environment:
      # Origins the browser may connect to: the API and LiveKit as the browser sees them.
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-http://localhost:9000 ws://localhost:7880}
    # Port 8081 is also the Expo dev server's and the e2e static server's port: stop this service before
    # `npx expo start --web` or `npm run e2e`, or run those on another port.
    ports:
      - "8081:8081"

volumes:
  postgres-data:
