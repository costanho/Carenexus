# Fly.io app for the CareNexus API (staging). Deploy from this directory: `fly deploy`.
# Secrets (database, JWT, MFA key, LiveKit, CORS origin) are NOT here: set them with `fly secrets import`.
# The README section "What staging and production must set" lists every one.
#
# One-time setup, from backend/carenexus-api:
#   fly apps create <app-name>                    # then put the name in `app` below
#   fly volumes create carenexus_storage --region fra --size 3
#   fly secrets import < <path to your git-ignored secrets file>
#   fly deploy

# Must be globally unique on Fly.io; change it if `fly apps create` says the name is taken.
app = "carenexus-api-staging"
# Frankfurt, next to a Neon project in AWS eu-central-1 (Neon has no African region). Keep API and database in the
# same region: most requests make several database round trips.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  # Starts as root only to hand the root-owned Fly volume to the carenexus user, then runs as carenexus.
  build-target = "volume-owner"

[env]
  # staging: local provider implementations (email, SMS, push, storage, payments) only log a warning.
  # production refuses them at startup until real providers are configured.
  CARENEXUS_ENVIRONMENT = "staging"
  SERVER_PORT = "9000"
  # Uploaded files live on the Fly volume mounted below. A volume belongs to ONE machine: keep a single machine
  # until a real (S3-compatible) storage provider replaces local storage.
  STORAGE_LOCAL_DIR = "/data/storage"
  # The local email provider never sends mail, so a required email confirmation would lock every new account out.
  AUTH_REQUIRE_VERIFIED_EMAIL = "false"
  LIVEKIT_ENABLED = "true"
  LIVEKIT_WEBHOOK_ENABLED = "false"
  # Neon's free compute allows about 100 connections; one machine needs far fewer.
  DB_POOL_MAX_SIZE = "10"
  DB_POOL_MIN_IDLE = "2"
  # Let the JVM use most of the machine's memory (the default is a quarter).
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=75"

[http_service]
  internal_port = 9000
  force_https = true
  # Scheduled jobs (reminders, outbound messages, expiry sweeps) run inside the API, so it must not sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/actuator/health"
    interval = "30s"
    timeout = "5s"
    # Flyway migrations run on the first start against an empty Neon database.
    grace_period = "90s"

[mounts]
  source = "carenexus_storage"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
