server:
  port: 0  # Random port for testing

jwt:
  secret: test-secret-key-that-is-at-least-32-characters-long-for-testing-only
  expiration: 900000  # 15 minutes

spring:
  application:
    name: carenexus-auth-server-test

  # PostgreSQL Test Container (auto-configured via ServiceConnection)
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    com.auth.server: DEBUG
    org.springframework.test.context: INFO
    org.testcontainers: INFO
