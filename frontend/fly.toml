# Fly.io app for the CareNexus web app (staging): the Expo static export behind nginx (frontend/Dockerfile).
# Deploy from this directory: `fly deploy`. No secrets: everything here is public by nature (it ends up in the
# browser), so it lives in this file.
#
# One-time setup, from frontend/:
#   fly apps create <app-name>     # then put the name in `app` below, and its URL in the API's CORS settings
#   fly deploy

app = "carenexus-web-staging"
# Same region as the API (backend/carenexus-api/fly.toml).
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

  # Inlined into the JavaScript bundle at build time: redeploy after changing them.
  [build.args]
    EXPO_PUBLIC_API_URL = "https://carenexus-api-staging.fly.dev"
    EXPO_PUBLIC_SUPPORT_EMAIL = ""

[env]
  # Read when nginx starts: origins the browser may connect to besides this site. Add the LiveKit project's
  # https:// and wss:// URLs here once video calls are configured.
  CSP_CONNECT_SRC = "https://carenexus-api-staging.fly.dev"

[http_service]
  internal_port = 8081
  force_https = true
  # Static files only: the machine may stop when idle and starts again on the next request (about a second).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
